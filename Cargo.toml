[workspace]
resolver = "3"
members = [
    "apps/play-desktop",
    "crates/play-core",
    "crates/play-media",
    "crates/play-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.104" # Gestion d'erreurs contextuelles dans les opérations qui peuvent échouer.
egui = "0.37.0" # Interface immédiate des panneaux, listes, boutons et contrôles.
egui-wgpu = { version = "0.37.0", features = ["winit", "wayland", "x11"] } # Rendu egui avec WGPU dans la fenêtre native.
egui-winit = { version = "0.37.0", default-features = false, features = ["wayland", "x11"] } # Traduction des événements winit pour egui.
hound = "3.5.1" # Écriture des captures audio en WAV PCM pour les backing tracks.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] } # Décodage des jaquettes JPEG et PNG.
lofty = "0.25.4" # Lecture des métadonnées audio et des jaquettes intégrées.
pollster = "1.0.1" # Exécution synchrone des initialisations WGPU asynchrones.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "recording", "symphonia-all"] } # Lecture, capture et décodage des fichiers audio.
rfd = "0.17.2" # Fenêtres natives de sélection de fichiers et de dossiers.
ron = "0.12.2" # Sérialisation de la playlist et des réglages dans la playlist.ron.
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] } # Sérialisation des réglages et modèles portables.
soundtouch = { version = "0.5.4", features = ["bundled"] } # Time-stretch des backing tracks en conservant la hauteur.
thiserror = "2.0.21" # Définition d'erreurs typées dans les bibliothèques du workspace.
winit = "0.30.13" # Fenêtre native, boucle d'événements et entré clavier/souris.
